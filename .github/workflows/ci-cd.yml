name: CI/CD

on:
  push:
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: funevents-api
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ==========================================
  # STAGE 1 - LINT / TEST
  # ==========================================
  test:
    name: Stage 1 - Lint / Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Ejercicio-1/requirements.txt

      - name: Run tests
        run: |
          pytest Ejercicio-1


  # ==========================================
  # STAGE 2 - SECURITY SCAN
  # ==========================================
  security:
    name: Stage 2 - Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image for security scan
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            Ejercicio-1

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'


  # ==========================================
  # STAGE 3 - BUILD & PUSH
  # ==========================================
  build:
    name: Stage 3 - Build & Push
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            Ejercicio-1

      - name: Show image tag
        run: |
          echo "Docker image:"
          echo "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

      # ==========================================
      # PUSH
      # ==========================================
      # Se deja preparado para Docker Hub/GHCR.
      # Para la prueba se puede utilizar GHCR.
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image for GHCR
        run: |
          docker tag \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Push image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}


  # ==========================================
  # STAGE 4 - DEPLOY SIMULATED
  # ==========================================
  deploy:
    name: Stage 4 - Deploy Simulado
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Simulate Kubernetes deployment
        run: |
          echo "=========================================="
          echo "Simulación de despliegue"
          echo "=========================================="

          echo "Actualizando Deployment funevents-api..."

          echo "kubectl set image deployment/funevents-api \
          funevents-api=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

          echo "Deployment actualizado correctamente."
          echo "Imagen desplegada: ${{ env.IMAGE_TAG }}"