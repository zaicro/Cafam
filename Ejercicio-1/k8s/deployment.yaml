apiVersion: apps/v1
kind: Deployment
metadata:
  name: funevents-api
spec:
  replicas: 2

  selector:
    matchLabels:
      app: funevents-api

  template:
    metadata:
      labels:
        app: funevents-api

    spec:
      containers:
        - name: funevents-api
          image: funevents-api:latest
          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: funevents-config

          livenessProbe:
            httpGet:
              path: /health
              port: 8080

          readinessProbe:
            httpGet:
              path: /health
              port: 8080